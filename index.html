<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AZ store | متجر إلكترونيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF2;--surface:#fff;--ink:#14212B;--muted:#5A6B78;--brand:#00675F;--on-brand:#fff;--line:#D3DCE3;--hdr:#E9EEF2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--surface:#17252F;--ink:#E8EEF2;--muted:#9AABB8;--brand:#2BB3A6;--on-brand:#06201D;--line:#2A3C48;--hdr:#0F1A22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A22;--surface:#17252F;--ink:#E8EEF2;--muted:#9AABB8;--brand:#2BB3A6;--on-brand:#06201D;--line:#2A3C48;--hdr:#0F1A22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:10}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hdr);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:700;font-size:1.35rem}
#open{position:relative;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:600}
#count{background:var(--brand);color:var(--on-brand);border-radius:999px;font-size:.8rem;padding:0 8px;margin-inline-start:6px}
main{max-width:980px;margin:0 auto;padding:0 16px 40px}
.hero{padding:28px 0 18px}
.hero h1{font-size:clamp(2rem,8vw,3.4rem);line-height:1.2;margin:0 0 10px;font-weight:700;max-width:14em}
.hero p{margin:0;color:var(--muted);max-width:30em}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 16px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:3.6rem}
.info{padding:10px 12px 12px}
.info small{color:var(--muted)}
.info h3{margin:0 0 8px;font-size:1rem;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.add{background:var(--brand);color:var(--on-brand);border:0;border-radius:8px;padding:4px 14px;cursor:pointer;font-weight:600}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
#sheet{position:fixed;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;max-width:560px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
#ov[hidden],#sheet[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top h2{margin:0;font-size:1.2rem}
#close{border:0;background:transparent;font-size:1.6rem;cursor:pointer;line-height:1}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li.empty{display:block;color:var(--muted);text-align:center;padding:24px 0}
.mini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:1.5rem}
li small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding:14px 0 8px}
input{width:100%;padding:10px 12px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
#send{width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer}
#send:disabled{opacity:.45;cursor:not-allowed}
#msg{color:var(--muted);min-height:1.7em;margin:4px 0}#pay{display:grid;gap:6px;margin:8px 0}#pay label{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}#pay input{width:auto;margin:0;accent-color:var(--brand)}#pi{color:var(--muted);font-size:.92rem;margin:0 0 8px}
#toast{position:fixed;inset:auto 0 calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><span class="logo" dir="ltr">AZ store</span><button id="open">السلة <span id="count" hidden>0</span></button></header>
<main>
  <section class="hero">
    <h1>إلكترونيات وإكسسوارات بأسعار واضحة</h1>
    <p>اختر منتجاتك وأرسل الطلب عبر واتساب خلال دقيقة.</p>
  </section>
  <div id="chips" role="group" aria-label="تصفية حسب الفئة"></div>
  <div id="grid"></div>
</main>

<div id="ov" hidden></div>
<section id="sheet" role="dialog" aria-modal="true" aria-label="سلة التسوق" hidden>
  <div class="top"><h2>سلتك</h2><button id="close" aria-label="إغلاق">×</button></div>
  <ul id="lines"></ul>
  <div class="tot"><span>الإجمالي</span><span id="total">0</span></div>
  <input id="nm" placeholder="الاسم" autocomplete="name">
  <input id="ph" placeholder="رقم الجوال" inputmode="tel" autocomplete="tel">
  <input id="ad" placeholder="العنوان (اختياري)" autocomplete="street-address">
  <div id="pay" role="radiogroup" aria-label="طريقة الدفع">
<label><input type="radio" name="pm" value="فودافون كاش" checked> فودافون كاش</label>
<label><input type="radio" name="pm" value="دفع إلكتروني (بطاقة أو إنستاباي)"> دفع إلكتروني (بطاقة أو إنستاباي)</label>
<label><input type="radio" name="pm" value="الدفع عند الاستلام"> الدفع عند الاستلام</label>
</div>
<p id="pi"></p>
<div id="msg" aria-live="polite"></div>
  <button id="send">أرسل الطلب عبر واتساب</button>
</section>
<div id="toast" role="status"></div>

<script>
// عدّل هذه القيم: رقم واتساب بصيغة دولية بدون + ، والعملة
var WA="201000000000", CUR="ج.م", VC="01000000000";
var P=[
{id:1,n:"سماعات لاسلكية",c:"صوتيات",p:750,e:"🎧",bg:"#CFE8E4"},
{id:2,n:"سبيكر بلوتوث",c:"صوتيات",p:900,e:"🔊",bg:"#D9E4F5"},
{id:3,n:"شاحن سريع 33 واط",c:"شحن",p:299,e:"⚡",bg:"#F7E8B5"},
{id:4,n:"باور بانك 20000",c:"شحن",p:650,e:"🔋",bg:"#DCEBC9"},
{id:5,n:"كيبل USB-C",c:"شحن",p:120,e:"🔌",bg:"#E6DDF2"},
{id:6,n:"ساعة ذكية",c:"ملحقات",p:1250,e:"⌚",bg:"#F5D9D0"},
{id:7,n:"ماوس لاسلكي",c:"ملحقات",p:230,e:"🖱️",bg:"#D5E9EE"},
{id:8,n:"كفر حماية للجوال",c:"ملحقات",p:150,e:"📱",bg:"#E3E3E3"}
];
var $=function(s){return document.querySelector(s)};
var cart={},cat="الكل",tt;
try{cart=JSON.parse(localStorage.getItem("wasla-cart")||"{}")}catch(e){}
Object.keys(cart).forEach(function(k){if(!P.some(function(x){return x.id==k})||!(cart[k]>0))delete cart[k]});
function save(){try{localStorage.setItem("wasla-cart",JSON.stringify(cart))}catch(e){}}
function fmt(n){return n.toLocaleString("en-US")+" "+CUR}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){el.classList.remove("on")},1500)}
function chips(){var cs=["الكل"].concat(P.map(function(x){return x.c}).filter(function(v,i,a){return a.indexOf(v)===i}));
$("#chips").innerHTML=cs.map(function(c){return '<button class="chip" aria-pressed="'+(c===cat)+'" data-cat="'+c+'">'+c+'</button>'}).join("")}
function grid(){$("#grid").innerHTML=P.filter(function(x){return cat==="الكل"||x.c===cat}).map(function(x){
return '<article class="card"><div class="tile" style="background:'+x.bg+'" aria-hidden="true">'+x.e+'</div><div class="info"><small>'+x.c+'</small><h3>'+x.n+'</h3><div class="row"><b>'+fmt(x.p)+'</b><button class="add" data-add="'+x.id+'" aria-label="أضف '+x.n+' إلى السلة">أضف</button></div></div></article>'}).join("")}
function render(){var ids=Object.keys(cart),n=0,t=0;
var h=ids.map(function(i){var x=P.filter(function(y){return y.id==i})[0];n+=cart[i];t+=x.p*cart[i];
return '<li><span class="mini" style="background:'+x.bg+'">'+x.e+'</span><div><div>'+x.n+'</div><small>'+fmt(x.p)+'</small></div><div class="qty"><button data-q="'+i+'" data-d="-1" aria-label="إنقاص">−</button><span>'+cart[i]+'</span><button data-q="'+i+'" data-d="1" aria-label="زيادة">+</button></div></li>'}).join("");
$("#lines").innerHTML=h||'<li class="empty">سلتك فارغة. أضف منتجًا من القائمة.</li>';
$("#count").textContent=n;$("#count").hidden=!n;$("#total").textContent=fmt(t);$("#send").disabled=!n;save()}
function sheet(on){$("#ov").hidden=!on;$("#sheet").hidden=!on;if(on)$("#close").focus()}
document.addEventListener("click",function(e){
var b=e.target.closest("button");if(e.target.id==="ov")return sheet(false);if(!b)return;
if(b.dataset.cat){cat=b.dataset.cat;chips();grid()}
else if(b.dataset.add){var id=b.dataset.add;cart[id]=(cart[id]||0)+1;render();toast("أضيف إلى السلة")}
else if(b.dataset.q){var q=b.dataset.q;cart[q]+=+b.dataset.d;if(cart[q]<1)delete cart[q];render()}
else if(b.id==="open")sheet(true);
else if(b.id==="close")sheet(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")sheet(false)});
$("#send").onclick=function(){
var nm=$("#nm").value.trim(),ph=$("#ph").value.trim(),ad=$("#ad").value.trim();
if(!nm||!ph){$("#msg").textContent="اكتب اسمك ورقم جوالك لإرسال الطلب.";return}
$("#msg").textContent="";var t=0;
var lines=Object.keys(cart).map(function(i){var x=P.filter(function(y){return y.id==i})[0];t+=x.p*cart[i];return "- "+x.n+" × "+cart[i]+" = "+fmt(x.p*cart[i])});
var txt="طلب جديد من متجر AZ store\n"+lines.join("\n")+"\nالإجمالي: "+fmt(t)+"\nالاسم: "+nm+"\nالجوال: "+ph+"\nطريقة الدفع: "+document.querySelector('input[name="pm"]:checked').value+(ad?"\nالعنوان: "+ad:"");
window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(txt),"_blank")};
var PM={"فودافون كاش":function(){return "حوّل الإجمالي إلى فودافون كاش على الرقم "+VC+" ثم أرسل صورة التحويل في واتساب مع الطلب."},"دفع إلكتروني (بطاقة أو إنستاباي)":function(){return "سنرسل لك رابط الدفع على واتساب بعد تأكيد الطلب."},"الدفع عند الاستلام":function(){return "تدفع للمندوب عند استلام الطلب."}};
function payInfo(){var v=document.querySelector('input[name="pm"]:checked').value;$("#pi").textContent=PM[v]()}
$("#pay").addEventListener("change",payInfo);
chips();grid();render();payInfo();
</script>
</body>
</html>
